<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kbr- — Personal website</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffefb;
      --ink: #232e32;
      --accent: #247462;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      justify-items: center;
      align-items: start;
      padding: 64px 24px 24px;
      background: #f1f3ee;
      color: var(--ink);
      font: 18px/1.75 Georgia, 'Times New Roman', serif;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: clamp(32px, 8vw, 56px) 24px;
      background: var(--paper);
      border: 1px solid #dde2d9;
      border-radius: 8px;
      box-shadow: 0 12px 40px #23372806;
      text-align: center;
    }
    nav { display: grid; gap: 20px; }
    a {
      color: var(--accent);
      text-underline-offset: 4px;
      padding: 4px;
    }
    a:first-child { font-size: clamp(26px, 6vw, 34px); }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Research links">
      <a href="/math-research">Math Research</a>
      <a href="https://github.com/kbr-/math-research">Math Research source</a>
    </nav>
  </main>
</body>
</html>
